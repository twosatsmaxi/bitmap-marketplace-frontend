version: '3.8'

services:
  bitmap-marketplace:
    image: ghcr.io/twosatsmaxi/bitmap-marketplace-frontend:latest
    container_name: bitmap-marketplace
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    networks:
      - bitmap-network
    labels:
      - "com.bitmap.description=Bitmap Marketplace Frontend"
      - "com.bitmap.version=1.0.0"

networks:
  bitmap-network:
    driver: bridge
